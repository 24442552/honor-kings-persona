<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>峡谷人格鉴识所 · 你是哪个王者英雄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0e14;
      --bg2: #121826;
      --card: #171e2b;
      --line: #2a3447;
      --gold: #e4c56b;
      --gold2: #8f6b2a;
      --cyan: #6ee7d2;
      --text: #f3ead7;
      --muted: #9aa6b8;
      --danger: #ef7b6c;
      --ok: #8fd19e;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(228,197,107,.16), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(110,231,210,.08), transparent 40%),
        var(--bg);
      line-height: 1.65;
    }
    button, .opt {
      font: inherit;
      color: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    .wrap {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    h1, h2, .brand { font-family: "ZCOOL XiaoWei", serif; font-weight: 400; }
    .top {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 22px;
    }
    .brand-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .brand { font-size: 28px; margin: 0; letter-spacing: .08em; color: var(--gold); }
    .sub { color: var(--muted); font-size: 14px; margin: 0; }
    .count { color: var(--cyan); font-size: 13px; white-space: nowrap; }
    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }
    .q-layout { display: flex; flex-direction: column; gap: 0; }
    .q-head, .q-foot { flex-shrink: 0; }
    .progress {
      height: 8px; background: #0f141d; border-radius: 99px; overflow: hidden; margin: 0 0 22px;
    }
    .progress > span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, var(--gold2), var(--gold));
      transition: width .25s ease;
    }
    .kicker { color: var(--gold); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    .q-title { font-size: 26px; line-height: 1.35; margin: 8px 0 10px; }
    .q-prompt { color: var(--muted); margin: 0 0 20px; }
    .opts { display: grid; gap: 12px; }
    .opts.locked { pointer-events: none; }
    .opt {
      text-align: left;
      background: #121826;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 16px 16px 18px;
      min-height: 56px;
      transition: border-color .15s, transform .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .opt.picked {
      border-color: var(--gold);
      background: #1b2433;
    }
    .opt:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }
    @media (hover: hover) and (pointer: fine) {
      .opt:hover {
        border-color: var(--gold);
        background: #1b2433;
      }
    }
    .opt:active { transform: translateY(1px); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
    .btn {
      background: var(--gold);
      color: #1a1408;
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      min-height: 44px;
      font-weight: 700;
    }
    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    details.back {
      margin-top: 14px;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    details.back summary {
      cursor: pointer;
      color: var(--cyan);
      min-height: 36px;
      display: flex;
      align-items: center;
    }
    .hero-head {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 18px;
      align-items: center;
    }
    .hero-head .q-title { font-size: 22px; line-height: 1.3; word-break: break-word; }
    .trait { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    .trait b { color: var(--gold); font-weight: 700; }
    .hero-head img {
      width: 120px; height: 120px; object-fit: cover;
      border-radius: 16px; border: 1px solid var(--gold2);
      background: #0f141d;
    }
    .badge {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--gold);
      margin-right: 6px;
    }
    .bars { display: grid; gap: 8px; margin: 18px 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .bar { height: 8px; background: #0f141d; border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--cyan); }
    .grid2 { display: grid; gap: 12px; }
    @media (min-width: 740px) {
      .grid2 { grid-template-columns: 1fr 1fr; }
      .q-title { font-size: 30px; }
      .hero-head .q-title { font-size: 26px; }
    }
    .block {
      background: #121826;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
    .block h3 { margin: 0 0 8px; font-size: 15px; color: var(--gold); }
    .near { display: grid; gap: 12px; margin-top: 8px; }
    .near button {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 12px;
      text-align: left;
      background: #121826;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      min-height: 76px;
    }
    .near img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
    .foot { color: var(--muted); font-size: 13px; margin-top: 14px; line-height: 1.55; }
    .gets {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px dashed var(--line);
    }
    .gets h3 {
      margin: 0 0 8px;
      font-size: 13px;
      letter-spacing: .12em;
      color: var(--gold);
    }
    .gets ul { margin: 0; padding: 0; list-style: none; }
    .gets li {
      position: relative;
      padding: 5px 0 5px 16px;
      color: var(--text);
      font-size: 14px;
    }
    .gets li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .75em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
    }
    .cover-title { font-size: 42px; line-height: 1.2; margin: 0 0 12px; color: var(--gold); }
    .mono { font-variant-numeric: tabular-nums; }
    @media (max-width: 739px) {
      .wrap {
        width: 100%;
        min-height: 100dvh;
        min-height: 100svh;
        padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
      }
      .top { margin-bottom: 12px; }
      .brand { font-size: 20px; letter-spacing: .06em; }
      .sub { font-size: 13px; line-height: 1.45; }
      .count { font-size: 12px; }
      body.mode-q .panel {
        flex: 1;
        min-height: 0;
        padding: 14px 14px 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      body.mode-cover .panel {
        flex: 0 0 auto;
        padding: 18px 16px 16px;
        overflow: visible;
      }
      body.mode-result .panel {
        flex: none;
        overflow: visible;
        display: block;
        padding: 16px;
      }
      .q-layout { flex: 1; min-height: 0; }
      .progress { height: 6px; margin: 0 0 10px; }
      .kicker { font-size: 11px; letter-spacing: .12em; }
      .q-title { font-size: 18px; line-height: 1.35; margin: 4px 0 6px; }
      .q-prompt { font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
      .opts {
        flex: 1;
        min-height: 0;
        gap: 8px;
        overflow-y: auto;
        align-content: start;
        -webkit-overflow-scrolling: touch;
      }
      .q-foot { margin-top: auto; }
      .opt {
        padding: 11px 12px;
        min-height: 44px;
        font-size: 14px;
        line-height: 1.4;
        border-radius: 12px;
      }
      .row { margin-top: 8px; }
      .btn { padding: 10px 16px; min-height: 40px; }
      details.back { margin-top: 8px; padding-top: 8px; }
      .cover-title { font-size: 28px; margin: 0 0 8px; }
      .gets { margin-top: 16px; padding-top: 14px; }
      .gets li { font-size: 13px; }
      .hero-head { grid-template-columns: 72px 1fr; gap: 12px; }
      .hero-head img { width: 72px; height: 72px; border-radius: 12px; }
      body.mode-q { overflow: hidden; }
      body.mode-cover, body.mode-result { overflow: auto; }
      body.mode-result .wrap { min-height: auto; display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress > span, .opt { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand-line">
        <p class="brand">峡谷人格鉴识所</p>
        <p class="count" id="heroCount"></p>
      </div>
      <p class="sub" id="siteSub">开黑现场 18 问。每题有专业依据，结论认真写人设。</p>
    </header>
    <section class="panel" id="app"></section>
  </main>
  <script>
    const QUESTIONS = [{"id": "q1", "title": "开黑麦突然没人说话。安静得像对面已经推完水晶。", "prompt": "有人当广播台，有人从来不回。你呢。", "backing": {"name": "外向性 Extraversion · IPIP Big Five Markers（Goldberg）", "text": "大五里的外向性，看社交能量从哪来。受不了冷场的人会去填麦；觉得说话有成本的人会不回、会静音。开黑一静，比问卷诚实。"}, "options": [{"label": "我来播报。兵线、草丛、谁在送，一条龙服务，你们听着就行", "vec": {"e": 18, "flash": 8, "pride": 6, "mid": 4}}, {"label": "丢一句「你们是去集体排队了吗」，然后自己先笑", "vec": {"e": 6, "o": 8, "cute": 6, "chaos": 5}}, {"label": "不回。打字太烦，沟通也有成本，他们说他们的", "vec": {"e": -12, "solo": 10, "c": 6, "late": 4}}, {"label": "谁话多就静音。自娱自乐，不想在游戏里浪费注意力", "vec": {"e": -8, "solo": 12, "dark": 6, "n": -4, "support": 4}}]}, {"id": "q2", "title": "该你的那份被吃了。公屏跳出一个问号。", "prompt": "兵、河蟹、红buff都算。辅助也会被抢。没这事的人，可以直说。", "backing": {"name": "宜人性 Agreeableness · IPIP / 合作—竞争倾向", "text": "宜人性高的人先圆场；低的人先计较公平。被占便宜那一下，比「你乐不乐意当好人」更准。从不计较的人，也是一种答案。"}, "options": [{"label": "回没事。真的没事。抢就抢，问号当表情包", "vec": {"a": 16, "roam": 8, "support": 8, "carry": -6}}, {"label": "精确到秒：那份姓我。问号请原路退回", "vec": {"a": -6, "c": 12, "control": 8, "mid": 6}}, {"label": "这种计较我从来不做。我没兵线，跟着混就好", "vec": {"a": 12, "support": 12, "roam": 10, "e": -6, "solo": 4}}, {"label": "吃我的，我就吃你的。我的你的不分家。从这一秒起他是野怪，野怪是可以打的", "vec": {"a": -12, "dark": 10, "jg": 8, "assassin": 8}}]}, {"id": "q3", "title": "选人还剩三秒。随机转盘已经转起来了。", "prompt": "有人本命教徒，有人天意信徒。三秒不够装。", "backing": {"name": "尽责性 Conscientiousness × 开放性 Openness · IPIP", "text": "尽责性锁计划，开放性吃未知。倒计时一亮，你是秒锁练过的，还是把命运交给转盘。"}, "options": [{"label": "秒锁本命。不熟的英雄没有户口", "vec": {"c": 14, "pride": 6, "late": -4, "solo": 4}}, {"label": "看缺什么补什么。跟着混就好，我不挑英雄", "vec": {"a": 10, "c": 8, "roam": 8, "support": 8, "carry": -4}}, {"label": "转吧。天意比我懂版本，我只负责挨骂", "vec": {"o": 14, "chaos": 10, "c": -8, "flash": 6}}, {"label": "锁一个对面最怕、队友最会在麦里尖叫的", "vec": {"e": 6, "dark": 8, "flash": 8, "jg": 6}}]}, {"id": "q4", "title": "这把已经送了两次。草又在晃。", "prompt": "崩了之后你的手还在不在。送的人是你，或不是你，都算。", "backing": {"name": "神经质 Neuroticism / 情绪稳定性 · BFI-10（Rammstedt & John, 2007）", "text": "有人被抓两次就宣判这把死刑；有人缩塔当无事发生。第三次草晃，是情绪音量旋钮。"}, "options": [{"label": "再送一个。战绩要完整，残缺的 0/2 不吉利", "vec": {"n": 12, "chaos": 10, "pride": -4, "cute": 4}}, {"label": "缩着打。该怎么发育还怎么发育，不表演", "vec": {"n": -8, "c": 10, "late": 8, "control": 6}}, {"label": "反蹲。你再来一次，这次我请你喝红", "vec": {"n": 4, "skill": 8, "jg": 8, "assassin": 6, "dark": 4}}, {"label": "这个剧本我认不进。我不怎么送，跟着混就好", "vec": {"n": -6, "a": 8, "support": 8, "roam": 6, "e": -4}}]}, {"id": "q5", "title": "有人说野区后面有条野路，能摸到对面泉水刷牙。", "prompt": "你是去验证玄学，还是先鉴定这人是不是卧底。", "backing": {"name": "经验开放性 · Need for Cognition（Cacioppo & Petty）", "text": "爱试新东西的人会走；爱算账的人先问胜率。同一条野路，有人当副本，有人当坑。"}, "options": [{"label": "走。不踩一下，怎么知道是不是幻觉", "vec": {"o": 16, "jg": 6, "flash": 6, "skill": 4}}, {"label": "先问掉不掉星。玄学不能当饭吃", "vec": {"c": 10, "control": 10, "o": 2, "late": 4}}, {"label": "不去。少整这些，塔下跟着打就行", "vec": {"a": 6, "n": 4, "roam": 6, "support": 6, "solo": 4}}, {"label": "能抓人我就信教。不能抓人，那叫抽象", "vec": {"o": 4, "dark": 8, "jg": 8, "assassin": 8, "carry": 4}}]}, {"id": "q6", "title": "排位弹窗：请选择你愿意用整晚去赎的那条路。", "prompt": "锁路就是选罪。孤儿、背锅、发育、保姆，认一个。", "backing": {"name": "岗位心理 / 角色理论 + MOBA分路职责", "text": "对抗路没观众，打野背锅，中路两边找你，发育路怕死，游走当后勤。你认哪条，往往就是你愿意扛哪种压力。"}, "options": [{"label": "对抗路。没人来也行，我在没人看的地方把线顶住", "vec": {"top": 22, "solo": 12, "warrior": 8, "tank": 6, "n": -4}}, {"label": "打野。地图户口本写我的名，输了也是我的名", "vec": {"jg": 22, "control": 8, "assassin": 8, "carry": 6, "pride": 4}}, {"label": "中路。几何中心归我，两边爆炸都来找我报销", "vec": {"mid": 22, "mage": 10, "flash": 4, "o": 4, "e": 4}}, {"label": "发育路或游走。要么我是C，要么我是C的妈", "vec": {"bot": 12, "roam": 12, "marksman": 6, "support": 6, "late": 6, "a": 4}}]}, {"id": "q7", "title": "不看皮肤，只看你愿意当哪种零件。", "prompt": "挨打、偷人、放技能、发育、背锅。零件决定人格。", "backing": {"name": "团队角色理论（Belbin）+ 职业原型（娱乐向）", "text": "有人扛、有人收、有人规划、有人收尾。选定位比直接问「你是不是控制狂」更不容易装好。"}, "options": [{"label": "肉。伤害打在我身上，这叫素质，也叫命苦", "vec": {"tank": 16, "warrior": 8, "a": 6, "solo": 4, "top": 6}}, {"label": "刀。我出现 0.4 秒，C 位去见水晶", "vec": {"assassin": 16, "jg": 8, "dark": 8, "skill": 8, "flash": 6}}, {"label": "技能。准了这把听我的，空了你们也别说话", "vec": {"mage": 16, "mid": 8, "o": 8, "control": 8, "skill": 4}}, {"label": "无尽或辅助装。要么我是终点，要么我供养终点", "vec": {"marksman": 10, "support": 10, "bot": 6, "roam": 6, "late": 8, "carry": 4}}]}, {"id": "q8", "title": "龙还差两刀。对面也在。队友问：开不开。", "prompt": "这一票比「我很团队」三个字诚实。", "backing": {"name": "Bartle玩家类型（1996）× Yee游戏动机（2006）", "text": "有人要进度条，有人要先看视野，有人听喊得最凶的，有人要让对面也拿不到。开龙是四种动机的交叉路口。"}, "options": [{"label": "开。龙不拿，这把白打，皮肤会痒", "vec": {"c": 8, "carry": 8, "pride": 6, "jg": 6, "late": -4}}, {"label": "先看眼。看不见就开，那叫给龙送人头", "vec": {"o": 6, "control": 12, "c": 6, "skill": 6, "mid": 4}}, {"label": "你们定。我跟着打，这种拍板我从来不做", "vec": {"a": 12, "roam": 8, "support": 8, "e": -4}}, {"label": "放。回家路上收过路费，龙是你爹我不管", "vec": {"dark": 12, "assassin": 8, "jg": 8, "a": -8, "chaos": 6}}]}, {"id": "q9", "title": "水晶炸了。结算界面转出来之前，你已经在腹诽了。", "prompt": "怪自己还是怪匹配，决定你是复盘还是发帖。", "backing": {"name": "心理控制源 Locus of Control（Rotter, 1966）", "text": "锅揽到自己身上的人会去改；锅甩给系统的人会去骂。两种都能活，下一步完全不同。"}, "options": [{"label": "怪我。这波走位是我本人亲自作的艺术品", "vec": {"c": 10, "n": 6, "skill": 8, "pride": -4}}, {"label": "怪匹配。这五个人是系统派来的刑具", "vec": {"n": 8, "chaos": 8, "o": 4, "dark": 4}}, {"label": "怪沟通。五张图五颗心，零个人看小地图", "vec": {"e": 4, "a": 6, "roam": 6, "control": 6}}, {"label": "OJBK。输了当交学费，皮肤还在，人还活着", "vec": {"n": -8, "o": 8, "late": 6, "flash": 4}}]}, {"id": "q10", "title": "现在打，能爽一口；苟到十五分钟，可能把对面射穿。", "prompt": "前期英雄和后期信徒，别在这装中庸。", "backing": {"name": "延迟满足 / 跨期选择（Mischel）+ 调节定向（Higgins）", "text": "有人要眼前的高光，有人拿前期去换后期。抢二、苟发育、入侵，都是同一条时间偏好。"}, "options": [{"label": "现在打。活着的高光才叫高光，死后剪辑没有灵魂", "vec": {"late": -12, "flash": 10, "e": 6, "jg": 6, "chaos": 6}}, {"label": "苟。我可以很无聊，很有钱，很十五分钟", "vec": {"late": 16, "c": 10, "marksman": 8, "bot": 8, "carry": 6}}, {"label": "我不拿也行，但不能让对面拿得像过年", "vec": {"dark": 8, "control": 8, "assassin": 6, "top": 4, "a": -4}}, {"label": "给需要的人。我负责活着，什么时候打不是我拍板", "vec": {"a": 12, "support": 10, "roam": 8, "carry": -6, "late": 4}}]}, {"id": "q11", "title": "公屏跳出四个字：你有点东西。", "prompt": "最小的镜子。当真、装蒜，还是转发给全队。", "backing": {"name": "HEXACO诚实—谦卑 Honesty-Humility（Ashton & Lee）", "text": "夸奖来了，有人当燃料，有人当烫手山芋，有人要证据。一句「有点东西」就够用。"}, "options": [{"label": "那必须。我本来就有点东西，峡谷网速慢，你们才看见", "vec": {"pride": 16, "e": 8, "flash": 8, "carry": 6}}, {"label": "回「没有没有」，同时截图，进相册，设为私密", "vec": {"pride": -6, "n": 8, "a": 6, "cute": 6}}, {"label": "哪一点。走位、伤害，还是我这张脸", "vec": {"c": 8, "o": 8, "skill": 8, "mid": 4}}, {"label": "不回。夸也要打字，心里知道就行", "vec": {"e": -8, "solo": 8, "a": 4, "pride": -4}}]}, {"id": "q12", "title": "和固定队友开黑，你们的绑定更像哪一种。", "prompt": "问的是你们怎么黏。没有固定队友的，也可以直说。英雄名只是比喻。", "backing": {"name": "成人依恋风格（Bowlby / Ainsworth / Bartholomew）", "text": "黏着要确认的像瑶挂件；用距离保护自己的像隐身；关键时刻一定在的像传送；要一次说清楚的像点名。用开黑绑定问，比问恋爱史少尴尬。"}, "options": [{"label": "挂件绑定（像瑶）：我上车，你输出，一份血条谈一场恋爱", "vec": {"a": 10, "n": 8, "roam": 10, "support": 10, "cute": 8, "solo": -8}}, {"label": "神隐绑定（像兰陵）：需要我的时候我在，不需要就当我死了", "vec": {"solo": 12, "dark": 8, "assassin": 8, "jg": 6, "a": -4, "e": -6}}, {"label": "传送绑定（像大乔）：平时各打各的，团战我会把家搬过来", "vec": {"c": 8, "control": 8, "roam": 6, "support": 6, "mid": 4}}, {"label": "我不黏。路人局自己玩，很少固定开黑", "vec": {"solo": 14, "e": -8, "a": -2, "late": 4, "support": 4}}]}, {"id": "q13", "title": "系统公告：本局野怪罢工，打不了。", "prompt": "核心玩法被拆。你是改命，还是先骂策划。", "backing": {"name": "对模糊的耐受 / 开放性 × 尽责性", "text": "规则一变，有人当新游戏，有人要攻略，有人偏去踩线。看你怎么消化突然没野的宇宙。"}, "options": [{"label": "野区不存在。线上见，把对面当野怪打", "vec": {"c": 6, "top": 8, "bot": 6, "late": 4, "warrior": 4}}, {"label": "新套路已经在脑内排版：无野局怎么赢，标题带深度", "vec": {"o": 10, "c": 10, "mid": 6, "control": 6}}, {"label": "规则就是拿来表演性违反的。我偏去空野区散步", "vec": {"o": 8, "chaos": 14, "flash": 8, "c": -8}}, {"label": "那我去当移动的眼。视野是新的野", "vec": {"roam": 10, "support": 8, "a": 6, "control": 6}}]}, {"id": "q14", "title": "队友麦里全是梗，一句正常话都没有。", "prompt": "别人开始发疯时，你是接梗、叫停、一起疯，还是直接静音。", "backing": {"name": "认知风格：抽象—具体（Vallacher & Wegner）", "text": "有人用梗活着，有人要听人话。接梗、叫停、一起疯、听出锅，四种都是沟通风格。"}, "options": [{"label": "接梗。失败也要失败得好看，这叫审美", "vec": {"o": 12, "flash": 10, "cute": 6, "chaos": 6}}, {"label": "叫停。先说人话，人话是暴击，梗是掉帧", "vec": {"c": 8, "a": -2, "control": 8, "n": 4}}, {"label": "一起疯。不会接梗的人，这把没有峡谷户口", "vec": {"e": 10, "pride": 6, "mid": 4, "flash": 6}}, {"label": "静音。梗也好锅也好，这种沟通我从来不参与", "vec": {"e": -10, "solo": 10, "dark": 6, "support": 4}}]}, {"id": "q15", "title": "队友开喷：你玩得像人机，建议回泉水泡澡。", "prompt": "吵架现场。喷子、段子手、死者、战绩律师，选一个真身。", "backing": {"name": "DISC行为风格（Marston；外显风格，严谨性弱于大五）", "text": "直接怼、把场面变成段子、冷处理、甩证据。不把你钉成字母，只看开火那一下。"}, "options": [{"label": "立刻化身喷子。从他这波支援喷到出装，喷到他泉水户口，喷到他麦里只剩蒸汽", "vec": {"e": 8, "pride": 10, "warrior": 8, "top": 8, "a": -6}}, {"label": "「谢谢你用生命给对面送经济，峡谷慈善家。」然后继续打", "vec": {"e": 12, "cute": 8, "chaos": 8, "flash": 6, "a": 4}}, {"label": "不回。静音，继续打。喷也是沟通成本", "vec": {"n": -8, "c": 8, "solo": 8, "e": -6, "a": 4}}, {"label": "甩战绩。数字比嘴诚实，面板比人机更像人", "vec": {"c": 10, "pride": 6, "skill": 6, "mid": 4, "carry": 4}}]}, {"id": "q16", "title": "钱只够做一件事：给你自己，或给那个最脆、最会送的队友。", "prompt": "ATM 还是终点。没经济权的人，也可以直说。", "backing": {"name": "社会价值取向 SVO（Van Lange）+ SDT关系需求", "text": "资源给人、留给自己、按效率分、还是谁抢我偏不给谁。辅助吃前者，射手吃后者。"}, "options": [{"label": "给他。他活着我才安全，我是行走的情绪 ATM", "vec": {"a": 14, "support": 12, "roam": 10, "carry": -8, "tank": 4}}, {"label": "给我。能把水晶点掉的是我，别谈奉献", "vec": {"carry": 14, "pride": 8, "marksman": 8, "assassin": 6, "bot": 6, "a": -6}}, {"label": "谁会用给谁。资源喂猪，猪不会推塔", "vec": {"c": 10, "control": 10, "mid": 6, "o": 4}}, {"label": "轮不到我。我没这份经济权，跟着混就好", "vec": {"support": 10, "roam": 8, "a": 8, "e": -4, "carry": -6}}]}, {"id": "q17", "title": "你要的高光，不想进别人的集锦就算了，但你自己要哪一种。", "prompt": "花活、成型、点名、推塔。镜头外也是一种镜头。", "backing": {"name": "感觉寻求 Sensation Seeking（Zuckerman）× 胜任需求 Competence（SDT）", "text": "有人要刺激和剪辑，有人要做成。秀连招和站桩发育，不是一种饿。"}, "options": [{"label": "花活。要让回放都觉得该给我单独做一期", "vec": {"flash": 16, "skill": 10, "assassin": 8, "e": 6, "jg": 4}}, {"label": "成型。我慢，我有钱，我会把对面射到怀疑手机", "vec": {"late": 14, "c": 8, "marksman": 8, "bot": 8, "n": -4}}, {"label": "点名。伤害出现在该出现的人身上，像手术，像报复", "vec": {"skill": 12, "control": 10, "mage": 6, "assassin": 4, "mid": 4}}, {"label": "不要高光。跟着混，赢了就行，镜头这 ": "破魔之箭，破的是自己的走位。", "praise": "领域成型时，对面只能改计划。", "epithet": "圈外不会走的领域主权的伽罗", "laneGood": "目标感、延迟满足、把个人成长做成团队后期。", "laneBad": "自我中心被说成发育，发育被说成贪。", "laneMeta": "局内是持续输出核心，最怕被点名。外界：C位光荣，也「鲁班必须死」式的脆弱神话。", "roleGood": "专注、手稳、相信时间站在自己这边。", "roleBad": "玻璃心与玻璃身一起出现，被抓就怪辅助。", "roleMeta": "官方持续物理输出；路人神话是C位正义，也是「为什么总死」。"}, {"id": 312, "name": "沈梦溪", "title": "爆弹怪猫", "role": "法师", "lanes": ["中路"], "img": "https://game.gtimg.cn/images/yxzj/img201606/heroimg/312/312.jpg", "vec": {"o": 60.0, "c": 54.0, "e": 56.0, "a": 51.0, "n": 50.0, "top": 10.0, "jg": 12.0, "mid": 45.0, "bot": 9.0, "roam": 8.0, "warrior": 11.0, "mage": 38.0, "tank": 6.0, "assassin": 6.0, "marksman": 6.0, "support": 11.0, "flash": 47.0, "carry": 42.0, "chaos": 37.0, "cute": 32.0, "late": 46.0, "solo": 42.0, "dark": 39.0, "skill": 55.0, "pride": 50.0, "control": 50.0}, "persona": "爆弹怪猫。你扔，你跑，你觉得爆炸是沟通。", "good": "消耗、爆发、中路。", "bad": "炸到自己。", "official": "官方：爆弹怪猫。", "outside": "可爱与爆炸并列，路人局又爱又怕。", "roast": "爆弹怪猫，怪的是准度。", "praise": "能把中路炸掉的猫，很少只是可爱。", "epithet": "支援去哪了的技能暴政的沈梦溪", "laneGood": "反应快、支援半径短、喜欢站在结构中心。", "laneBad": "容易自认核电，线权变成性格，支援变成施舍。", "laneMeta": "局内要清线、对线、支援边路。刻板印象是「中单最大」，也是「中单去哪了」。", "roleGood": "用距离和技能解释战场，脑子比拳头先到。", "roleBad": "脆、依赖技能命中，失手就像当众念错诗。", "roleMeta": "官方是法术核心；刻板印象从「中单女神」到「技能都空」。"}, {"id": 507, "name": "李信", "title": "谋世之战", "role": "战士", "lanes": ["对抗路", "发育路"], "img": "https://game.gtimg.cn/images/yxzj/img201606/heroimg/507/507.jpg", "vec": {"o": 50.0, "c": 60.0, "e": 56.0, "a": 43.0, "n": 56.0, "top": 37.0, "jg": 9.0, "mid": 8.0, "bot": 36.0, "roam": 11.0, "warrior": 41.0, "mage": 8.0, "tank": 15.0, "assassin": 10.0, "marksman": 5.0, "support": 10.0, "flash": 49.0, "carry": 50.0, "chaos": 38.0, "cute": 32.0, "late": 52.0, "solo": 70.0, "dark": 38.0, "skill": 54.0, "pride": 42.0, "control": 43.0}, "persona": "你有光也有暗，并坚持这叫完整。形态是你的政治。", "good": "适应版本、边路威胁、自我改造。", "bad": "切形态切到自我认同障碍。", "official": "官方：谋世之战。", "outside": "强度常被讨论，人设常被说「又帅又分裂」。", "roast": "谋世之战，谋的是你到底出哪套。", "praise": "能在两种战争里活 法，是一种礼貌的暴政。", "epithet": "跳去无人区的抓不住月的嫦娥", "laneGood": "反应快、支援半径短、喜欢站在结构中心。", "laneBad": "容易自认核电，线权变成性格，支援变成施舍。", "laneMeta": "局内要清线、对线、支援边路。刻板印象是「中单最大」，也是「中单去哪了」。", "roleGood": "用距离和技能解释战场，脑子比拳头先到。", "roleBad": "脆、依赖技能命中，失手就像当众念错诗。", "roleMeta": "官方是法术核心；刻板印象从「中单女神」到「技能都空」。"}, {"id": 511, "name": "猪八戒", "title": "无忧猛士", "role": "坦克", "lanes": ["对抗路", "打野"], "img": "https://game.gtimg.cn/images/yxzj/img201606/heroimg/511/511.jpg", "vec": {"o": 51.0, "c": 46.0, "e": 48.0, "a": 60.0, "n": 39.0, "top": 38.0, "jg": 38.0, "mid": 11.0, "bot": 11.0, "roam": 9.0, "warrior": 8.0, "mage": 9.0, "tank": 36.0, "assassin": 10.0, "marksman": 7.0, "support": 6.0, "flash": 33.0, "carry": 48.0, "chaos": 36.0, "cute": 38.0, "late": 46.0, "solo": 54.0, "dark": 36.0, "skill": 41.0, "pride": 48.0, "control": 57.0}, "persona": "你抗压，你回血，你相信肚子是一种战术。", "good": "厚、赖、能把对面打烦。", "bad": "贪吃资源，边路变成食堂。", "official": "官方：无忧猛士。", "outside": "「八戒抢二」是名场面，也是对线噩梦的出处。", "roast": "无忧，是因为你不看小地图。", "praise": "能把压力吃掉的人，队伍会轻松一个段位。", "epithet": "边路食堂的把压力吃掉的猪八戒", "laneGood": "抗压、自我调节、能在缺少观众的地方把线权当成信仰。", "laneBad": "容易变成情绪上的孤儿，把「没人来」写成全队对不起我。", "laneMeta": "局内职责是承压、换血、制造单带或开团入口；路人局刻板印象是「上单是孤独的」，也是「上单最会抢资源却最会喊没人」。", "roleGood": "承诺承伤，把血条变成公共设施。", "roleBad": "可能把挨打当成唯一语言，输出全靠嘴。", "roleMeta": "官方开团与承伤；外界「肉就该挡」，死了也是「你怎么开的」。"}, {"id": 529, "name": "盘古", "title": "破晓之神", "role": "战士", "lanes": ["打野", "对抗路"], "img": "https://game.gtimg.cn/images/yxzj/img201606/heroimg/529/529.jpg", "vec": {"o": 53.0, "c": 56.0, "e": 57.0, "a": 49.0, "n": 50.0, "top": 35.0, "jg": 41.0, "mid": 8.0, "bot": 7.0, "roam": 9.0, "warrior": 37.0, "mage": 7.0, "tank": 12.0, "assassin": 13.0, "marksman": 9.0, "support": 12.0, "flash": 42.0, "carry": 52.0, "chaos": 38.0, "cute": 36.0, "late": 45.0, "solo": 69.0, "dark": 37.0, "skill": 52.0, "pride": 49.0, "control": 50.0}, "persona": "你要开局就存在。创世是你的时间管理。", "good": "前期压迫、战士尊严、节奏。", "bad": "创完世发现后期不会做人。", "official": "官方：破晓之神。", "outside": "版本宠儿与版本弃子之间跳，名字一直很大。", "roast": "破晓之神，破晓之后呢？", "praise": "能把前十 师", "lanes": ["中路"], "img": "https://game.gtimg.cn/images/yxzj/img201606/heroimg/582/582.jpg", "vec": {"o": 59.0, "c": 47.0, "e": 54.0, "a": 46.0, "n": 47.0, "top": 6.0, "jg": 12.0, "mid": 44.0, "bot": 14.0, "roam": 6.0, "warrior": 8.0, "mage": 41.0, "tank": 11.0, "assassin": 8.0, "marksman": 4.0, "support": 7.0, "flash": 42.0, "carry": 46.0, "chaos": 42.0, "cute": 35.0, "late": 41.0, "solo": 41.0, "dark": 36.0, "skill": 49.0, "pride": 50.0, "control": 51.0}, "persona": "万妙之心。你是被允许自定义的人，所以你很难被一句话钉死——你也享受这种逃逸。", "good": "可塑性、中路、实验精神。", "bad": "自定义到没有自我。", "official": "官方元流体系：法师侧，万妙之心。", "outside": "玩家会说「这不算英雄，这是模板」。模板恰恰是你的性格。", "roast": "万妙，妙的是你还没想好出装。", "praise": "能长成很多种法的人，很少僵死。", "epithet": "支援去哪了的技能暴政的元流之子(法师)", "laneGood": "反应快、支援半径短、喜欢站在结构中心。", "laneBad": "容易自认核电，线权变成性格，支援变成施舍。", "laneMeta": "局内要清线、对线、支援边路。刻板印象是「中单最大」，也是「中单去哪了」。", "roleGood": "用距离和技能解释战场，脑子比拳头先到。", "roleBad": "脆、依赖技能命中，失手就像当众念错诗。", "roleMeta": "官方是法术核心；刻板印象从「中单女神」到「技能都空」。"}, {"id": 581, "name": "元流之子(坦克)", "title": "止戈之道", "role": "坦克", "lanes": ["对抗路", "打野", "游走"], "img": "https://game.gtimg.cn/images/yxzj/img201606/heroimg/581/581.jpg", "vec": {"o": 51.0, "c": 50.0, "e": 51.0, "a": 60.0, "n": 40.0, "top": 40.0, "jg": 38.0, "mid": 13.0, "bot": 13.0, "roam": 13.0, "warrior": 8.0, "mage": 5.0, "tank": 43.0, "assassin": 11.0, "marksman": 10.0, "support": 6.0, "flash": 30.0, "carry": 49.0, "chaos": 42.0, "cute": 39.0, "late": 47.0, "solo": 61.0, "dark": 38.0, "skill": 41.0, "pride": 42.0, "control": 55.0}, "persona": "止戈之道。你选择成为墙，并且把这当成一种修。", "good": "承伤、对抗、可塑性。", "bad": "止戈止到不打架。", "official": "官方元流体系：坦克侧。", "outside": "模板肉，评价取决于你怎么长。", "roast": "止戈之道，止的是你的参团。", "praise": "自愿成为结构的人，队伍会稳。", "epithet": "没人来也要顶的人肉护栏的元流之子(坦克)", "laneGood": "抗压、自我调节、能在缺少观众的地方把线权当成信仰。", "laneBad": "容易变成情绪上的孤儿，把「没人来」写成全队对不起我。", "laneMeta": "局内职责是承压、换血、制造单带或开团入口；路人局刻板印象是「上单是孤独的」，也是「上单最会抢资源却最会喊没人」。", "roleGood": "承诺承伤，把血条变成公共设施。", "roleBad": "可能把挨打当成唯一语言，输出全靠嘴。", "roleMeta": "官方开团与承伤；外界「肉就该挡」，死了也是「你怎么开的」。"}, {"id": 577, "       ["a","宜人性"],
      ["n","情绪反应"]
    ];

    const state = { i: 0, answers: [], view: "cover", result: null };
    let locked = false;

    function emptyVec() {
      const v = {};
      KEYS.forEach(k => v[k] = 0);
      return v;
    }
    function addVec(a, b) {
      KEYS.forEach(k => { a[k] += (b[k] || 0); });
    }
    function mag(v) {
      return Math.sqrt(KEYS.reduce((s,k) => s + v[k]*v[k], 0)) || 1;
    }
    function cosine(a, b) {
      let dot = 0;
      KEYS.forEach(k => dot += (a[k]||0) * (b[k]||0));
      return dot / (mag(a) * mag(b));
    }
    function oceanFrom(v) {
      const raw = {
        o: 50 + v.o * 0.9 + v.flash * 0.15,
        c: 50 + v.c * 0.9 + v.late * 0.2 + v.control * 0.1,
        e: 50 + v.e * 0.9 + v.pride * 0.15,
        a: 50 + v.a * 0.9 - v.dark * 0.2,
        n: 50 + v.n * 0.9 - v.control * 0.1
      };
      const out = {};
      Object.keys(raw).forEach(k => out[k] = Math.max(8, Math.min(96, raw[k])));
      return out;
    }
    function score() {
      const user = emptyVec();
      state.answers.forEach((idx, qi) => addVec(user, QUESTIONS[qi].options[idx].vec));
      const ranked = HEROES.map(h => ({ h, s: cosine(user, h.vec) }))
        .sort((a,b) => b.s - a.s);
      const ocean = oceanFrom(user);
      return { user, ranked, ocean };
    }
    function el(html) {
      const d = document.createElement("div");
      d.innerHTML = html.trim();
      return d.firstElementChild;
    }
    function renderCover() {
      return `
        <p class="kicker">18 问 · ${HEROES.length} 英雄</p>
        <h2 class="cover-title">你不是来被分类的。<br/>你是来被一个英雄认领的。</h2>
        <p class="q-prompt">按你在峡谷里会做的选。答完出人设，也出路人评价。</p>
        <div class="row">
          <button class="btn" id="start">开始鉴识</button>
        </div>
        <div class="gets">
          <h3>答完你会拿到</h3>
          <ul>
            <li>一个最像你的英雄，外加两个接近的灵魂</li>
            <li>人设、分路、职业，好的一面和不好的一面</li>
            <li>官方怎么定义你，路人怎么夸、怎么骂</li>
          </ul>
          <p class="foot">每题可展开「本题在测什么」。有大五人格这类依据，当娱乐测试看就好。</p>
        </div>
      `;
    }
    function renderQ() {
      const q = QUESTIONS[state.i];
      const pct = Math.round((state.i / QUESTIONS.length) * 100);
      return `
        <div class="q-layout">
          <div class="q-head">
            <div class="progress" aria-hidden="true"><span style="width:${pct}%"></span></div>
            <p class="kicker">第 ${state.i+1} / ${QUESTIONS.length} 问</p>
            <h2 class="q-title">${q.title}</h2>
            <p class="q-prompt">${q.prompt}</p>
          </div>
          <div class="opts">
            ${q.options.map((o, idx) => `<button class="opt" data-i="${idx}">${o.label}</button>`).join("")}
          </div>
          <div class="q-foot">
            ${state.i > 0 ? `<div class="row"><button class="btn ghost" id="back">上一问</button></div>` : ""}
            <details class="back">
              <summary>本题在测什么</summary>
              <p><b>${q.backing.name}</b></p>
              <p>${q.backing.text}</p>
            </details>
          </div>
        </div>
      `;
    }
    function pctBar(n) {
      return `<div class="bar"><i style="width:${n}%"></i></div>`;
    }
    function heroCard(item, tag) {
      const h = item.h;
      const pct = Math.round(item.s * 1000) / 10;
      return `
        <div class="${tag==="main" ? "" : "block"}">
          <div class="hero-head">
            <img src="${h.img}" alt="${h.name}头像" width="120" height="120" onerror="this.alt='头像未加载'; this.style.opacity=.3" />
            <div>
              <p class="kicker">${tag==="main" ? "主英雄" : "接近英雄"} · 匹配 ${pct}%</p>
              <h2 class="q-title" style="margin:6px 0 8px">${h.epithet}</h2>
              <p style="margin:0 0 8px;color:var(--gold)">${h.name} · ${h.title}</p>
              <p style="margin:0">
                <span class="badge">${h.role}</span>
                ${h.lanes.map(l => `<span class="badge">${l}</span>`).join("")}
              </p>
            </div>
          </div>
        </div>
      `;
    }
    function renderResult() {
      const { ranked, ocean } = state.result;
      const main = ranked[0];
      const near = ranked.slice(1,3);
      const h = main.h;
      return `
        ${heroCard(main, "main")}
        <div class="bars" aria-label="人格倾向">
          ${OCEAN.map(([k,name]) => `<div><div class="bar-label"><span>${name}</span><span class="mono">${Math.round(ocean[k])}</span></div>${pctBar(ocean[k])}</div>`).join("")}
        </div>
        <div class="grid2">
          <article class="block"><h3>性格 · 局内人设</h3><p>${h.persona}</p></article>
          <article class="block"><h3>官方怎么定义</h3><p>${h.official}</p></article>
          <article class="block"><h3>好的一面</h3><p>${h.good}</p><p>${h.roleGood}</p><p>${h.laneGood}</p></article>
          <article class="block"><h3>不好的一面</h3><p>${h.bad}</p><p>${h.roleBad}</p><p>${h.laneBad}</p></article>
          <article class="block"><h3>分路特质</h3><p>${h.laneMeta}</p></article>
          <article class="block"><h3>职业特质</h3><p>${h.roleMeta}</p></article>
          <article class="block"><h3>外界刻板印象 / 吐槽</h3><p class="trait"><b>特质</b>　${h.bad}</p><p>${h.outside}</p><p>${h.roast}</p></article>
          <article class="block"><h3>外界的夸奖</h3><p class="trait"><b>特质</b>　${h.good}</p><p>${h.praise}</p></article>
        </div>
        <h3 style="margin:22px 0 8px;color:var(--gold)">另外两个接近的灵魂</h3>
        <div class="near">
          ${near.map((item, idx) => `
            <button data-swap="${idx+1}">
              <img src="${item.h.img}" alt="${item.h.name}" width="56" height="56" />
              <div>
                <strong>${item.h.name}</strong> · ${item.h.title}
                <div class="sub">${item.h.epithet}</div>
                <div class="sub">${item.h.role} / ${item.h.lanes.join("、")} · ${Math.round(item.s*1000)/10}%</div>
              </div>
            </button>
          `).join("")}
        </div>
        <div class="row">
          <button class="btn" id="retry">再测一次</button>
        </div>
        <p class="foot">人设来自官方定位，也来自路人怎么夸、怎么骂。</p>
      `;
    }
    function paint() {
      const app = document.getElementById("app");
      document.body.classList.remove("mode-cover", "mode-q", "mode-result");
      document.body.classList.add("mode-" + state.view);
      const siteSub = document.getElementById("siteSub");
      if (siteSub) siteSub.hidden = state.view !== "cover";
      if (state.view === "cover") app.innerHTML = renderCover();
      if (state.view === "q") app.innerHTML = renderQ();
      if (state.view === "result") app.innerHTML = renderResult();
      const active = document.activeElement;
      if (active && app.contains(active) && typeof active.blur === "function") active.blur();
      app.querySelector("#start")?.addEventListener("click", () => { state.view = "q"; paint(); });
      app.querySelector("#back")?.addEventListener("click", () => {
        if (locked) return;
        state.i -= 1;
        state.answers.pop();
        paint();
      });
      app.querySelector("#retry")?.addEventListener("click", () => {
        state.i = 0; state.answers = []; state.view = "cover"; state.result = null; paint();
      });
      app.querySelectorAll(".opt").forEach(btn => {
        btn.addEventListener("click", () => pick(Number(btn.dataset.i), btn));
      });
      app.querySelectorAll("[data-swap]").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.swap);
          const ranked = state.result.ranked;
          const tmp = ranked[0];
          ranked[0] = ranked[idx];
          ranked[idx] = tmp;
          paint();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }
    function pick(idx, btn) {
      if (locked || state.view !== "q") return;
      locked = true;
      btn.blur();
      btn.classList.add("picked");
      btn.closest(".opts")?.classList.add("locked");
      state.answers.push(idx);
      const wait = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 220;
      setTimeout(() => {
        if (state.i === QUESTIONS.length - 1) {
          state.result = score();
          state.view = "result";
        } else {
          state.i += 1;
        }
        locked = false;
        paint();
        window.scrollTo(0, 0);
      }, wait);
    }
    document.getElementById("heroCount").textContent = "图鉴 " + HEROES.length + " 人";
    paint();
  </script>
</body>
</html>
